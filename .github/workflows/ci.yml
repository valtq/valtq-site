name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: valtq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @valtq/types build

      - name: Generate Prisma Client
        run: pnpm --filter api db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/valtq_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/valtq_test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/valtq_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/valtq_test

      - name: Build web
        run: pnpm --filter web build

      - name: Build API
        run: pnpm --filter api build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/valtq_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/valtq_test

      - name: Test API
        run: pnpm --filter api test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/valtq_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/valtq_test
          NODE_ENV: test
